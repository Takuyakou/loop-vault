name: Security and test gates

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run security:scan
      - run: npm run security:audit
      - run: npm run validate:phase-docs
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run typecheck:e2e
      # Keep FULL budgets and assertions; avoid concurrent files contaminating timing tests.
      - run: npm test -- --maxWorkers=4 --testTimeout=30000 --reporter=dot --no-file-parallelism
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  rust-advisories:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Audit locked Rust dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
